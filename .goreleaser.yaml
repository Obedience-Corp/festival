#   macos:
#     - enabled: true
#       sign:
#         certificate: "{{ .Env.MACOS_SIGN_P12 }}"
#         password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
#       notarize:
#         key: "{{ .Env.MACOS_NOTARY_KEY }}"
#         key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
#         issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"

universal_binaries:
  - replace: true
    id: fest
    name_template: "fest"
  - replace: true
    id: camp
    name_template: "camp"
  - replace: true
    id: festival
    name_template: "festival"
