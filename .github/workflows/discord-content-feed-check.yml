name: Check Discord project feed

on:
  pull_request:
    paths:
      - '.github/workflows/discord-content-feed*.yml'
      - 'scripts/*discord_content_feed.py'
      - 'docs/discord-spotlights.json'
      - '.justfiles/community.just'
  push:
    branches: [main]
    paths:
      - 'scripts/*discord_content_feed.py'
      - 'docs/discord-spotlights.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_discord_content_feed.py'
