# .goreleaser.yaml
version: 2

before:
  hooks:
    - bash scripts/completions.sh

builds:
  - id: fest
    dir: fest
    main: ./cmd/fest
    binary: fest
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      # Windows is intentionally disabled for stable releases until
      # fest+camp Windows runtime behavior is production-ready.
      # Re-enable by uncommenting:
      # - windows
    goarch:
      - amd64
      - arm64
    # When Windows is re-enabled, keep arm64 ignored until supported:
    # ignore:
    #   - goos: windows
    #     goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/Obedience-Corp/fest/internal/version.Version={{.Version}}
      - -X github.com/Obedience-Corp/fest/internal/version.Commit={{.Commit}}
      - -X github.com/Obedience-Corp/fest/internal/version.BuildDate={{.Date}}

  - id: camp
    dir: camp
    main: ./cmd/camp
    binary: camp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      # Windows is intentionally disabled for stable releases until
      # fest+camp Windows runtime behavior is production-ready.
      # Re-enable by uncommenting:
      # - windows
    goarch:
      - amd64
      - arm64
    # When Windows is re-enabled, keep arm64 ignored until supported:
    # ignore:
    #   - goos: windows
    #     goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/Obedience-Corp/camp/internal/version.Version={{.Version}}
      - -X github.com/Obedience-Corp/camp/internal/version.Commit={{.Commit}}
      - -X github.com/Obedience-Corp/camp/internal/version.BuildDate={{.Date}}

  - id: festival
    dir: festival-installer
    main: ./cmd/festival
    binary: festival
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: festival-suite
    ids: [fest, camp, festival]
    name_template: >-
      festival-
      {{- .Version }}-
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}-
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    # When Windows builds are re-enabled, keep Windows archives as .zip:
    # format_overrides:
    #   - goos: windows
    #     format: zip
    files:
      - README.md
      - LICENSE
      - NOTICE
      - install.sh
      - completions/*
      - shell/*

nfpms:
  - id: festival
    package_name: festival
    file_name_template: "{{ .ConventionalFileName }}"
    ids:
      - fest
      - camp
      - festival
    vendor: Obedience Corp
    homepage: "https://fest.build"
    maintainer: "Lance Rogers <lance@obediencecorp.com>"
    description: |-
      Festival Methodology CLI suite.
      AI-native project planning with fest, camp, and the festival installer/launcher.
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/bin
    section: devel
    priority: optional
    conflicts:
      - festival
    contents:
      - src: ./LICENSE
        dst: /usr/share/licenses/festival/LICENSE
      - src: ./NOTICE
        dst: /usr/share/licenses/festival/NOTICE
      - src: ./README.md
        dst: /usr/share/doc/festival/README.md
      - src: ./completions/fest.bash
        dst: /usr/share/bash-completion/completions/fest
      - src: ./completions/_fest
        dst: /usr/share/zsh/vendor-completions/_fest
      - src: ./completions/fest.fish
        dst: /usr/share/fish/vendor_completions.d/fest.fish
      - src: ./completions/camp.bash
        dst: /usr/share/bash-completion/completions/camp
      - src: ./completions/_camp
        dst: /usr/share/zsh/vendor-completions/_camp
      - src: ./completions/camp.fish
        dst: /usr/share/fish/vendor_completions.d/camp.fish
      - src: ./completions/festival.bash
        dst: /usr/share/bash-completion/completions/festival
      - src: ./completions/_festival
        dst: /usr/share/zsh/vendor-completions/_festival
      - src: ./completions/festival.fish
        dst: /usr/share/fish/vendor_completions.d/festival.fish
      - src: ./shell/festival.bash
        dst: /usr/share/festival/shell/festival.bash
      - src: ./shell/festival.zsh
        dst: /usr/share/festival/shell/festival.zsh
      - src: ./shell/festival.fish
        dst: /usr/share/festival/shell/festival.fish

aurs:
  - name: festival-bin
    ids:
      - festival-suite
    homepage: "https://fest.build"
    description: "Festival Methodology CLI suite (fest, camp, and festival) - AI-native project planning"
    maintainers:
      - "Obedience Corp <contact@obediencecorp.com>"
    license: "Apache-2.0"
    private_key: "{{ .Env.AUR_SSH_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/festival-bin.git"
    skip_upload: auto
    provides:
      - fest
      - camp
    conflicts:
      - fest
      - camp
      - festival
    package: |-
      install -Dm755 "./fest" "${pkgdir}/usr/bin/fest"
      install -Dm755 "./camp" "${pkgdir}/usr/bin/camp"
      install -Dm755 "./festival" "${pkgdir}/usr/bin/festival"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/festival/LICENSE"
      install -Dm644 "./NOTICE" "${pkgdir}/usr/share/licenses/festival/NOTICE"
      install -Dm644 "./completions/fest.bash" "${pkgdir}/usr/share/bash-completion/completions/fest"
      install -Dm644 "./completions/_fest" "${pkgdir}/usr/share/zsh/site-functions/_fest"
      install -Dm644 "./completions/fest.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/fest.fish"
      install -Dm644 "./completions/camp.bash" "${pkgdir}/usr/share/bash-completion/completions/camp"
      install -Dm644 "./completions/_camp" "${pkgdir}/usr/share/zsh/site-functions/_camp"
      install -Dm644 "./completions/camp.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/camp.fish"
      install -Dm644 "./completions/festival.bash" "${pkgdir}/usr/share/bash-completion/completions/festival"
      install -Dm644 "./completions/_festival" "${pkgdir}/usr/share/zsh/site-functions/_festival"
      install -Dm644 "./completions/festival.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/festival.fish"
      install -Dm644 "./shell/festival.bash" "${pkgdir}/usr/share/festival/shell/festival.bash"
      install -Dm644 "./shell/festival.zsh" "${pkgdir}/usr/share/festival/shell/festival.zsh"
      install -Dm644 "./shell/festival.fish" "${pkgdir}/usr/share/festival/shell/festival.fish"
    commit_msg_template: "Update to {{ .Tag }}"

# Scoop publishing is temporarily disabled while Windows support is stabilized.
# Re-enable by uncommenting this block after Windows artifacts are re-enabled.
