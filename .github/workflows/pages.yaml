name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published Festival release tag to deploy (for example v0.3.22)'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: festival-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.release_tag }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release-triggered deploys use the exact tagged source. A manual
          # refresh picks up reviewed docs merged after the immutable tag.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          submodules: recursive
          fetch-depth: 0

      - name: Verify release tag and published Windows route
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+|-dev\.[0-9]+)?$ ]]; then
            echo "::error::Expected a Festival release tag, got $RELEASE_TAG"
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [ "${{ github.event_name }}" = 'workflow_run' ]; then
            if [ "$tag_commit" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Release checkout does not match tag $RELEASE_TAG"
              exit 1
            fi
          else
            if ! git merge-base --is-ancestor "$tag_commit" HEAD; then
              echo "::error::Manual docs checkout does not contain release tag $RELEASE_TAG"
              exit 1
            fi
            for component in camp fest festival-installer; do
              if [ "$(git rev-parse "$RELEASE_TAG:$component")" != "$(git rev-parse "HEAD:$component")" ]; then
                echo "::error::Manual docs checkout has a different $component pin from $RELEASE_TAG"
                exit 1
              fi
            done
          fi
          if [[ "$RELEASE_TAG" == *-rc.* || "$RELEASE_TAG" == *-dev.* ]]; then
            exit 0
          fi
          release_state="$(gh release view "$RELEASE_TAG" --repo Obedience-Corp/festival \
            --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | join(" ")')"
          if [ "$release_state" != 'false false' ]; then
            echo "::error::Stable release $RELEASE_TAG is draft or prerelease"
            exit 1
          fi
          proof_dir="${RUNNER_TEMP}/published-windows-scoop"
          mkdir -p "$proof_dir"
          archive_name="festival-${RELEASE_TAG#v}-windows-x86_64.zip"
          gh release download "$RELEASE_TAG" --repo Obedience-Corp/festival \
            --pattern "$archive_name" --dir "$proof_dir"
          gh release download "$RELEASE_TAG" --repo Obedience-Corp/festival \
            --pattern checksums.txt --dir "$proof_dir"
          gh api 'repos/Obedience-Corp/scoop-bucket/contents/festival.json?ref=main' \
            --jq .content | base64 --decode > "$proof_dir/festival.json"
          python3 scripts/verify_published_windows_scoop.py \
            --tag "$RELEASE_TAG" \
            --archive "$proof_dir/$archive_name" \
            --checksums "$proof_dir/checksums.txt" \
            --manifest "$proof_dir/festival.json"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: fest/go.mod
          cache-dependency-path: |
            fest/go.sum
            camp/go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.157.0'
          extended: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Detect release docs profile
        id: docs_profile
        run: |
          case "$RELEASE_TAG" in
            v*-dev.*)
              echo "cli_profile=dev" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "cli_profile=stable" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build site for Pages
        run: |
          HUGO_BASEURL="https://docs.fest.build/" \
          CLI_PROFILE="${{ steps.docs_profile.outputs.cli_profile }}" \
          just docs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
