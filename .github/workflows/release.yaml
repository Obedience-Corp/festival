name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Festival version without leading v (example: 0.2.14)'
        required: true
        type: string
      release_mode:
        description: 'Release channel / npm dist-tag'
        required: true
        default: stable
        type: choice
        options:
          - stable
          - rc
          - dev
      action:
        description: 'Manual recovery action for an already-tagged release'
        required: true
        default: npm-only
        type: choice
        options:
          - npm-only
          - post-publish

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            fest/go.sum
            camp/go.sum
            festival-installer/go.sum

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Configure private Go modules
        if: env.GO_PRIVATE_TOKEN != ''
        run: |
          git config --global url."https://${GO_PRIVATE_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
          GOPRIVATE: github.com/Obedience-Corp/*

      - name: Detect release channel
        id: release_channel
        run: |
          case "${GITHUB_REF_NAME}" in
            v*-dev.*)
              echo "mode=dev" >> "$GITHUB_OUTPUT"
              echo "cli_profile=dev" >> "$GITHUB_OUTPUT"
              ;;
            v*-rc.*)
              echo "mode=rc" >> "$GITHUB_OUTPUT"
              echo "cli_profile=stable" >> "$GITHUB_OUTPUT"
              ;;
            v*)
              echo "mode=stable" >> "$GITHUB_OUTPUT"
              echo "cli_profile=stable" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unsupported tag format: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Validate stable publish credentials
        # Only the stable channel publishes to the marketplace, so dev and rc
        # releases skip this check entirely; that gate stays as it is.
        if: steps.release_channel.outputs.mode == 'stable'
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          MARKETPLACE_PUBLISH_TOKEN: ${{ secrets.MARKETPLACE_PUBLISH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          missing=0
          for name in HOMEBREW_TAP_GITHUB_TOKEN AUR_SSH_KEY MARKETPLACE_PUBLISH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret ${name}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit "${missing}"
          fi
          push_ok="$(GH_TOKEN="${MARKETPLACE_PUBLISH_TOKEN}" gh api repos/Obedience-Corp/marketplace --jq '.permissions.push')"
          if [ "${push_ok}" != "true" ]; then
            echo "::error::MARKETPLACE_PUBLISH_TOKEN cannot push to Obedience-Corp/marketplace (needed to open the marketplace entry pull request)"
            exit 1
          fi

      - name: Trust AUR host key
        if: steps.release_channel.outputs.mode == 'stable'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Verify tagged fest/camp/festival-installer pins
        run: just test release-pins "${{ steps.release_channel.outputs.mode }}"

      - name: Check bundled submodule module resolution
        run: just test bundled-module-resolution

      - name: Check docs profile
        run: just test docs-profile

      - name: Test release operator
        run: just test release-operator

      - name: Build CLIs for smoke test
        run: CLI_PROFILE=${{ steps.release_channel.outputs.cli_profile }} just build all

      - name: Run beginner path smoke
        run: just test beginner-path-smoke

      - name: Check Claude Code plugin sync
        run: |
          export PATH="$(pwd)/bin:$PATH"
          just plugin check

      - name: Generate bundled release notes
        run: |
          cd tools/release-notes
          go run . \
            --repo-root ../.. \
            --tag "${GITHUB_REF_NAME}" \
            --output "${RUNNER_TEMP}/festival-release-notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser stamps each bundled tool with its own version and commit,
      # read from the pinned submodules. It errors on an unset .Env key, so a
      # missing step here fails the release instead of shipping binaries that
      # report the festival tag as their fest/camp version.
      - name: Resolve bundled tool versions
        run: bash scripts/tool-versions.sh >> "$GITHUB_ENV"

      # AUR (and occasionally other publishers) can fail after the GitHub release
      # is already live. Soft-fail GoReleaser in that case so npm/marketplace and
      # release-notes rewrite still run; hard-fail only if no release was created.
      - name: Run GoReleaser
        id: goreleaser
        continue-on-error: true
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOPRIVATE: github.com/Obedience-Corp/*
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          SCOOP_GITHUB_TOKEN: ${{ secrets.SCOOP_GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Require published GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo Obedience-Corp/festival --json tagName --jq .tagName >/dev/null 2>&1; then
            if [ "${{ steps.goreleaser.outcome }}" = "failure" ]; then
              echo "::warning::GoReleaser reported failure, but ${GITHUB_REF_NAME} is published. Continuing post-publish steps (likely AUR/homebrew side failure)."
            fi
            exit 0
          fi
          echo "::error::GoReleaser failed before publishing GitHub release ${GITHUB_REF_NAME}"
          exit 1

      - name: Rewrite GitHub release body from bundled component notes
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo Obedience-Corp/festival \
            --notes-file "${RUNNER_TEMP}/festival-release-notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_MODE: ${{ steps.release_channel.outputs.mode }}
        run: scripts/publish_npm_package.sh

      - name: Ensure checksums for marketplace entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          if [ ! -f dist/checksums.txt ]; then
            echo "dist/checksums.txt missing after GoReleaser; downloading from the published release"
            gh release download "${GITHUB_REF_NAME}" \
              --repo Obedience-Corp/festival \
              --pattern checksums.txt \
              --dir dist
          fi
          test -f dist/checksums.txt

      - name: Generate marketplace entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published_at="$(gh release view "${GITHUB_REF_NAME}" \
            --repo Obedience-Corp/festival --json publishedAt --jq .publishedAt)"
          go -C tools/release-operator run . emit-marketplace-entry \
            --repo-root ../.. \
            --tag "${GITHUB_REF_NAME}" \
            --channel "${{ steps.release_channel.outputs.mode }}" \
            --checksums dist/checksums.txt \
            --output dist/marketplace/obey-package.json \
            --published-at "${published_at}"

      # Keep this step and its counterpart in the workflow_dispatch job below
      # in sync; a diff between them is invisible until a release runs.
      - name: Publish marketplace entry
        env:
          MARKETPLACE_PUBLISH_TOKEN: ${{ secrets.MARKETPLACE_PUBLISH_TOKEN }}
          GH_TOKEN: ${{ secrets.MARKETPLACE_PUBLISH_TOKEN }}
          FESTIVAL_TAG: ${{ github.ref_name }}
          RELEASE_CHANNEL: ${{ steps.release_channel.outputs.mode }}
        run: scripts/publish_marketplace_entry.sh

  npm-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'npm-only'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          path: release-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PACKAGE_DIR: release-source/npm
          NPM_PACKAGE_VERSION: ${{ inputs.version }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: scripts/publish_npm_package.sh

  # Recover post-GoReleaser publishers for an already-created tag/release when
  # a side publisher (commonly AUR maintenance) aborted the main release job.
  post-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'post-publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            fest/go.sum
            camp/go.sum
            festival-installer/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Recovery checks out the immutable release tag, which may contain the
      # bug being recovered from. Build the validator explicitly and inject
      # the script's supported override so post-publish does not depend on the
      # tag's fallback `go run` invocation.
      - name: Build marketplace metadata validator
        run: go -C festival-installer build -o "${RUNNER_TEMP}/festival-metadata" ./cmd/festival-metadata

      - name: Require published GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v${{ inputs.version }}" --repo Obedience-Corp/festival --json tagName --jq .tagName

      - name: Generate bundled release notes
        run: |
          cd tools/release-notes
          go run . \
            --repo-root ../.. \
            --tag "v${{ inputs.version }}" \
            --output "${RUNNER_TEMP}/festival-release-notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rewrite GitHub release body from bundled component notes
        run: |
          gh release edit "v${{ inputs.version }}" \
            --repo Obedience-Corp/festival \
            --notes-file "${RUNNER_TEMP}/festival-release-notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PACKAGE_VERSION: ${{ inputs.version }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: scripts/publish_npm_package.sh

      - name: Download checksums from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "v${{ inputs.version }}" \
            --repo Obedience-Corp/festival \
            --pattern checksums.txt \
            --dir dist
          test -f dist/checksums.txt

      - name: Generate marketplace entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published_at="$(gh release view "v${{ inputs.version }}" \
            --repo Obedience-Corp/festival --json publishedAt --jq .publishedAt)"
          go -C tools/release-operator run . emit-marketplace-entry \
            --repo-root ../.. \
            --tag "v${{ inputs.version }}" \
            --channel "${{ inputs.release_mode }}" \
            --checksums dist/checksums.txt \
            --output dist/marketplace/obey-package.json \
            --published-at "${published_at}"

      # Keep this step and its counterpart in the tag-triggered job above in
      # sync; a diff between them is invisible until a release runs.
      - name: Publish marketplace entry
        env:
          MARKETPLACE_PUBLISH_TOKEN: ${{ secrets.MARKETPLACE_PUBLISH_TOKEN }}
          GH_TOKEN: ${{ secrets.MARKETPLACE_PUBLISH_TOKEN }}
          FESTIVAL_TAG: v${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.release_mode }}
          FESTIVAL_METADATA_BIN: ${{ runner.temp }}/festival-metadata
        run: scripts/publish_marketplace_entry.sh
