#       token: "{{ .Env.SCOOP_GITHUB_TOKEN }}"
#     homepage: "https://fest.build"
#     description: "Festival Methodology CLI suite (fest, camp, and festival) - AI-native project planning"
#     license: "Apache-2.0"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

homebrew_casks:
  - repository:
      owner: Obedience-Corp
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

    name: festival
    ids:
      - festival-suite
    homepage: "https://github.com/Obedience-Corp/festival"
    description: "Festival Methodology CLI suite (fest, camp, and festival)"
    license: "Apache-2.0"
    skip_upload: auto
    directory: Casks

    binaries:
      - fest
      - camp
      - festival
    completions:
      bash: completions/fest.bash
      zsh: completions/_fest
      fish: completions/fest.fish

    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/fest", "#{staged_path}/camp", "#{staged_path}/festival"]
          end
          shell_dir = "#{HOMEBREW_PREFIX}/share/festival/shell"
          system_command "/bin/mkdir", args: ["-p", shell_dir, "#{HOMEBREW_PREFIX}/etc/bash_completion.d", "#{HOMEBREW_PREFIX}/share/zsh/site-functions", "#{HOMEBREW_PREFIX}/share/fish/vendor_completions.d"]
          system_command "/bin/cp", args: ["#{staged_path}/shell/festival.bash", "#{shell_dir}/festival.bash"]
          system_command "/bin/cp", args: ["#{staged_path}/shell/festival.zsh", "#{shell_dir}/festival.zsh"]
          system_command "/bin/cp", args: ["#{staged_path}/shell/festival.fish", "#{shell_dir}/festival.fish"]
          system_command "/bin/cp", args: ["#{staged_path}/completions/camp.bash", "#{HOMEBREW_PREFIX}/etc/bash_completion.d/camp"]
          system_command "/bin/cp", args: ["#{staged_path}/completions/_camp", "#{HOMEBREW_PREFIX}/share/zsh/site-functions/_camp"]
          system_command "/bin/cp", args: ["#{staged_path}/completions/camp.fish", "#{HOMEBREW_PREFIX}/share/fish/vendor_completions.d/camp.fish"]
          system_command "/bin/cp", args: ["#{staged_path}/completions/festival.bash", "#{HOMEBREW_PREFIX}/etc/bash_completion.d/festival"]
          system_command "/bin/cp", args: ["#{staged_path}/completions/_festival", "#{HOMEBREW_PREFIX}/share/zsh/site-functions/_festival"]
          system_command "/bin/cp", args: ["#{staged_path}/completions/festival.fish", "#{HOMEBREW_PREFIX}/share/fish/vendor_completions.d/festival.fish"]
        uninstall: |
          system_command "/bin/rm", args: ["-f", "#{HOMEBREW_PREFIX}/share/festival/shell/festival.bash", "#{HOMEBREW_PREFIX}/share/festival/shell/festival.zsh", "#{HOMEBREW_PREFIX}/share/festival/shell/festival.fish", "#{HOMEBREW_PREFIX}/etc/bash_completion.d/camp", "#{HOMEBREW_PREFIX}/share/zsh/site-functions/_camp", "#{HOMEBREW_PREFIX}/share/fish/vendor_completions.d/camp.fish", "#{HOMEBREW_PREFIX}/etc/bash_completion.d/festival", "#{HOMEBREW_PREFIX}/share/zsh/site-functions/_festival", "#{HOMEBREW_PREFIX}/share/fish/vendor_completions.d/festival.fish"]

    caveats: |
      Homebrew installs static fest, camp, and festival completions. To activate navigation helpers
      (cgo, cr, csw, cint, fgo, fls) as well, add one line to your shell config:

        # bash (~/.bashrc)
        source \"$(brew --prefix)/share/festival/shell/festival.bash\"

        # zsh (~/.zshrc)
        source \"$(brew --prefix)/share/festival/shell/festival.zsh\"

        # fish (~/.config/fish/config.fish)
        source \"$(brew --prefix)/share/festival/shell/festival.fish\"

release:
  github:
    owner: Obedience-Corp
    name: festival

  prerelease: auto

  header: |
    ## Festival {{ .Tag }}

    Festival Methodology CLI suite release, including `fest`, `camp`, and `festival`.

  footer: |
    **Full Changelog**: https://github.com/Obedience-Corp/festival/compare/{{ .PreviousTag }}...{{ .Tag }}

    ## Installation

    See [full installation guide](https://fest.build/install/) for all platforms.

    | Platform | Command |
    |----------|---------|
    | npm / pnpm / bun | `npm install -g @obedience-corp/festival` |
    | macOS | `brew install --cask Obedience-Corp/tap/festival` |
    | Arch Linux | `yay -S festival-bin` |
    | Debian/Ubuntu | Download `.deb` from assets below |
    | Fedora/RHEL | Download `.rpm` from assets below |
    | Windows | Temporarily paused while Windows support is stabilized |

# macOS signing and notarization — disabled until Apple Developer account is configured.
# To enable: set MACOS_SIGN_P12, MACOS_SIGN_PASSWORD, MACOS_NOTARY_KEY,
# MACOS_NOTARY_KEY_ID, and MACOS_NOTARY_ISSUER_ID secrets, then uncomment below.
#
