name: Check marketplace reconciliation

on:
  pull_request:
    paths:
      - 'scripts/reconcile_*.py'
      - 'scripts/test_reconcile_*.py'
      - '.github/workflows/marketplace-reconcile*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -v -s scripts -p 'test_reconcile_*.py'
